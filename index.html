<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Rain</title>
    <link rel="icon" href="data:," />
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        canvas {
            background: #000;
            border: 2px solid #7ff7ff;
            box-shadow: 0 0 16px rgba(127, 247, 255, 0.6);
            max-width: 100vw;
            max-height: 100vh;
        }
        #fullscreen {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font: 13px "Courier New", monospace;
            color: #7ff7ff;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #7ff7ff;
            padding: 6px 10px;
            cursor: pointer;
        }
        #fullscreen:hover {
            background: rgba(127, 247, 255, 0.2);
        }
        :fullscreen canvas, :-webkit-full-screen canvas {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            border: none;
            box-shadow: none;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <button id="fullscreen" type="button">Full screen (F)</button>
    <script src="./assets.js"></script>
    <script src="./game.js"></script>
    <script src="./rules.js"></script>
    <script src="./draw.js"></script>
    <script src="./main.js"></script>
</body>
</html>
